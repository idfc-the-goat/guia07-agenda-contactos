<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agenda de Contactos</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="encabezado">
      <h1>Agenda de Contactos</h1>
      <p>
        Guía 07 - Ejercicio propuesto 02 (HTML, CSS, JavaScript, Git y GitHub)
      </p>
    </header>

    <main class="contenedor">
      <!-- Registrar contacto -->
      <section class="panel">
        <h2>Nuevo contacto</h2>
        <form id="formContacto" novalidate>
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" placeholder="Ej. María Quispe" />

          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" placeholder="Ej. 984123456" />

          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" placeholder="Ej. maria@correo.com" />

          <button type="submit" class="btn btn-primario">
            Guardar contacto
          </button>
          <p id="mensajeForm" class="mensaje"></p>
        </form>
      </section>

      <!-- Lista de contactos -->
      <section class="panel">
        <h2>Mis contactos <span id="contador" class="badge">0</span></h2>
        <input
          type="text"
          id="buscador"
          placeholder="Buscar por nombre o teléfono..."
        />
        <div id="listaContactos" class="lista"></div>
      </section>

      <!-- Detalle de un contacto -->
      <section class="panel">
        <h2>Detalle del contacto</h2>
        <div id="detalle">
          <p class="vacio">Selecciona un contacto y presiona "Ver".</p>
        </div>
      </section>
    </main>

    <!-- Cada funcionalidad vive en su propio archivo (una rama por archivo) -->
    <script src="js/datos.js"></script>
    <script src="js/agregar.js"></script>
    <script src="js/listar.js"></script>
    <script src="js/ver.js"></script>
    <script src="js/eliminar.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
